<!DOCTYPE html>
<html lang="fr" data-theme="dark">
    <!-- Copyright (c) 2026 Battelle Energy Alliance, LLC. All rights reserved. -->
    <head>
        <base target="_blank">
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Portail Oculox de supervision et d'investigation de la sécurité OT" />
        <title>Oculox | Sécurité OT</title>
        <link rel="icon" type="image/png" href="assets/img/icone_logo.png" />
        <style>
            *, *::before, *::after {
                box-sizing: border-box;
            }

            :root {
                color-scheme: dark;
                --page: #04080d;
                --page-alt: #071018;
                --surface: #0a141c;
                --surface-strong: #0d1b24;
                --text: #e9f5f9;
                --muted: #87a0ad;
                --accent: #22d3ee;
                --accent-strong: #00a8c7;
                --line: rgba(120, 190, 215, 0.20);
                --line-strong: rgba(34, 211, 238, 0.58);
                --grid: rgba(120, 190, 215, 0.055);
                --shadow: rgba(0, 0, 0, 0.45);
            }

            [data-theme="light"] {
                color-scheme: light;
                --page: #eef3f6;
                --page-alt: #e4edf1;
                --surface: #ffffff;
                --surface-strong: #f8fbfc;
                --text: #07161d;
                --muted: #58717d;
                --accent: #0e7f9b;
                --accent-strong: #08647b;
                --line: rgba(11, 58, 77, 0.16);
                --line-strong: rgba(14, 127, 155, 0.56);
                --grid: rgba(11, 58, 77, 0.05);
                --shadow: rgba(11, 58, 77, 0.14);
            }

            html {
                min-width: 320px;
                background: var(--page);
            }

            body {
                margin: 0;
                min-height: 100vh;
                overflow-x: hidden;
                background: var(--page);
                color: var(--text);
                font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                transition: background-color 180ms ease, color 180ms ease;
            }

            @keyframes floaty {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            @keyframes ringpulse {
                0%, 100% { opacity: 0.35; transform: scale(1); }
                50% { opacity: 0.9; transform: scale(1.04); }
            }

            @keyframes serviceFloat {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-5px); }
            }

            @keyframes spokePulse {
                0%, 100% { opacity: 0.28; }
                50% { opacity: 0.68; }
            }

            button, a {
                font: inherit;
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            .top-band {
                position: relative;
                min-height: 590px;
                overflow: hidden;
                background-color: var(--page);
                border-bottom: 1px solid var(--line);
            }

            .top-band::before {
                position: absolute;
                inset: 0;
                background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                background-size: 64px 64px;
                content: "";
                pointer-events: none;
            }

            .site-header {
                position: relative;
                z-index: 2;
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 74px;
                padding: 14px 44px;
                border-bottom: 1px solid var(--line);
            }

            .brand-logo {
                display: block;
                width: auto;
                height: 42px;
                object-fit: contain;
            }

            .theme-toggle {
                display: inline-flex;
                align-items: center;
                min-width: 102px;
                height: 38px;
                gap: 10px;
                padding: 0 13px;
                border: 1px solid var(--line);
                border-radius: 19px;
                background: var(--surface);
                color: var(--muted);
                cursor: pointer;
            }

            .theme-toggle:hover,
            .theme-toggle:focus-visible {
                border-color: var(--line-strong);
                outline: none;
            }

            .theme-track {
                position: relative;
                width: 34px;
                height: 18px;
                flex: 0 0 auto;
                border: 1px solid var(--line);
                border-radius: 9px;
                background: rgba(34, 211, 238, 0.10);
            }

            .theme-knob {
                position: absolute;
                top: 2px;
                left: 17px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 8px rgba(34, 211, 238, 0.50);
                transition: left 180ms ease;
            }

            [data-theme="light"] .theme-knob {
                left: 2px;
            }

            .theme-label {
                min-width: 34px;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0;
                text-transform: uppercase;
            }

            .hero {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 510px;
                padding: 62px 24px 76px;
                text-align: center;
            }

            .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                min-height: 32px;
                padding: 5px 15px;
                border: 1px solid var(--line);
                border-radius: 16px;
                background: var(--surface);
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0;
                text-transform: uppercase;
            }

            .status-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 8px var(--accent);
            }

            .hero-logo {
                display: block;
                width: 400px;
                max-width: 72vw;
                height: auto;
                margin: 30px auto 8px;
                object-fit: contain;
                filter: drop-shadow(0 16px 26px var(--shadow));
                animation: floaty 7s ease-in-out infinite;
            }

            .hero h1 {
                max-width: 760px;
                margin: 10px auto 0;
                color: var(--text);
                font-size: 52px;
                line-height: 1.08;
                font-weight: 750;
                letter-spacing: 0;
            }

            .hero-rule {
                width: 64px;
                height: 2px;
                margin: 26px auto 0;
                background: var(--accent);
            }

            .hero p {
                max-width: 610px;
                margin: 20px auto 0;
                color: var(--muted);
                font-size: 17px;
                line-height: 1.6;
            }

            .services {
                padding: 62px 24px 52px;
                background: var(--page-alt);
            }

            .section-label {
                margin: 0;
                color: var(--muted);
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0;
                text-align: center;
                text-transform: uppercase;
            }

            .orbit {
                position: relative;
                width: 820px;
                height: 820px;
                margin: 0 auto;
            }

            .orbit-ring,
            .orbit-ring-inner {
                position: absolute;
                top: 50%;
                left: 50%;
                border-radius: 50%;
                pointer-events: none;
            }

            .orbit-ring {
                width: 580px;
                height: 580px;
                margin: -290px 0 0 -290px;
                border: 1px dashed var(--line);
            }

            .orbit-ring-inner {
                width: 290px;
                height: 290px;
                margin: -145px 0 0 -145px;
                border: 1px solid rgba(34, 211, 238, 0.12);
                animation: ringpulse 5s ease-in-out infinite;
            }

            .spokes {
                position: absolute;
                top: 50%;
                left: 50%;
                z-index: 1;
                width: 0;
                height: 0;
                pointer-events: none;
            }

            .spoke {
                position: absolute;
                top: 0;
                left: 0;
                width: 212px;
                height: 1px;
                transform: rotate(var(--angle));
                transform-origin: 0 50%;
                background: linear-gradient(90deg, var(--line-strong), rgba(34, 211, 238, 0.08));
                animation: spokePulse 4.8s ease-in-out infinite;
                animation-delay: var(--delay);
            }

            .core {
                position: absolute;
                top: 50%;
                left: 50%;
                z-index: 2;
                display: flex;
                width: 150px;
                height: 150px;
                margin: -75px 0 0 -75px;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border: 1px solid var(--line-strong);
                border-radius: 50%;
                background: var(--surface-strong);
                box-shadow: 0 16px 44px var(--shadow);
            }

            .core::before {
                position: absolute;
                inset: -10px;
                border: 1px solid var(--line);
                border-top-color: transparent;
                border-left-color: transparent;
                border-radius: 50%;
                content: "";
                animation: spin 12s linear infinite;
            }

            .core strong {
                color: var(--text);
                font-size: 18px;
                letter-spacing: 0;
            }

            .core span {
                margin-top: 3px;
                color: var(--accent);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0;
            }

            .service-node {
                --node-x: 0px;
                --node-y: 0px;
                position: absolute;
                top: 50%;
                left: 50%;
                z-index: 3;
                display: flex;
                width: 156px;
                min-height: 192px;
                margin: -78px 0 0 -78px;
                transform: translate(var(--node-x), var(--node-y));
                flex-direction: column;
                align-items: center;
                gap: 11px;
            }

            .service-node:hover,
            .service-node:focus-visible {
                outline: none;
            }

            .service-node:hover .hexagon,
            .service-node:focus-visible .hexagon {
                box-shadow: 0 12px 32px var(--shadow), 0 0 0 2px rgba(34, 211, 238, 0.12);
                transform: translateY(-4px);
                animation-play-state: paused;
            }

            .service-node:nth-of-type(1) { --node-x: 0px; --node-y: -290px; }
            .service-node:nth-of-type(2) { --node-x: 251px; --node-y: -145px; }
            .service-node:nth-of-type(3) { --node-x: 251px; --node-y: 145px; }
            .service-node:nth-of-type(4) { --node-x: 0px; --node-y: 290px; }
            .service-node:nth-of-type(5) { --node-x: -251px; --node-y: 145px; }
            .service-node:nth-of-type(6) { --node-x: -251px; --node-y: -145px; }

            .hexagon {
                display: flex;
                width: 156px;
                height: 156px;
                align-items: center;
                justify-content: center;
                background: linear-gradient(150deg, var(--accent), rgba(34, 211, 238, 0.14));
                clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
                transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
                animation: serviceFloat 6s ease-in-out infinite;
            }

            .service-node:nth-of-type(2n) .hexagon { animation-delay: -2s; }
            .service-node:nth-of-type(3n) .hexagon { animation-delay: -4s; }

            .hexagon-inner {
                display: flex;
                width: 153px;
                height: 153px;
                align-items: center;
                justify-content: center;
                background: var(--surface);
                clip-path: inherit;
            }

            .service-icon {
                display: block;
                width: 78px;
                height: 78px;
                object-fit: contain;
            }

            .service-icon.symbol {
                width: 64px;
                height: 64px;
                color: var(--accent);
            }

            .service-name {
                color: var(--text);
                font-size: 14px;
                font-weight: 700;
                letter-spacing: 0;
                text-align: center;
            }

            .site-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                min-height: 68px;
                padding: 18px 44px;
                border-top: 1px solid var(--line);
                background: var(--page);
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
                letter-spacing: 0;
                text-transform: uppercase;
            }

            @media (max-width: 900px) {
                .top-band {
                    min-height: auto;
                }

                .site-header {
                    padding: 12px 20px;
                }

                .brand-logo {
                    height: 36px;
                }

                .hero {
                    min-height: 500px;
                    padding: 58px 20px 72px;
                }

                .hero h1 {
                    font-size: 42px;
                }

                .services {
                    padding: 52px 20px;
                }

                .orbit {
                    display: grid;
                    width: 100%;
                    max-width: 620px;
                    height: auto;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    gap: 20px;
                    padding-top: 32px;
                }

                .orbit-ring,
                .orbit-ring-inner,
                .core,
                .spokes {
                    display: none;
                }

                .service-node,
                .service-node:nth-of-type(n) {
                    position: static;
                    width: 100%;
                    min-height: 180px;
                    margin: 0;
                    transform: none;
                }
            }

            @media (max-width: 560px) {
                .theme-toggle {
                    min-width: 80px;
                }

                .theme-label {
                    display: none;
                }

                .hero {
                    min-height: 460px;
                }

                .hero h1 {
                    font-size: 36px;
                }

                .hero p {
                    font-size: 15px;
                }

                .orbit {
                    grid-template-columns: 1fr;
                }

                .site-footer {
                    flex-direction: column;
                    justify-content: center;
                    gap: 5px;
                    padding: 18px 20px;
                    text-align: center;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    scroll-behavior: auto !important;
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="top-band">
            <header class="site-header">
                <a href="/" target="_self" aria-label="Accueil Oculox">
                    <img class="brand-logo" src="assets/img/icone_logo.png" alt="Oculox" />
                </a>
                <button class="theme-toggle" id="themeToggle" type="button" title="Basculer le thème" aria-label="Basculer le thème" aria-pressed="true">
                    <span class="theme-track" aria-hidden="true"><span class="theme-knob"></span></span>
                    <span class="theme-label" id="themeLabel">Dark</span>
                </button>
            </header>

            <main>
                <section class="hero">
                    <div class="status-badge"><span class="status-dot"></span>Plateforme de supervision OT</div>
                    <img class="hero-logo" src="assets/img/logo_Oculox.png" alt="Plateforme Oculox" />
                    <h1>Une vision totale.<br />Zéro angle mort.</h1>
                    <div class="hero-rule" aria-hidden="true"></div>
                    <p>Supervision, analyse et protection de vos infrastructures IT et OT.</p>
                </section>
            </main>
        </div>

        <section class="services" aria-labelledby="servicesTitle">
            <h2 class="section-label" id="servicesTitle">Outils</h2>
            <div class="orbit">
                <div class="orbit-ring" aria-hidden="true"></div>
                <div class="orbit-ring-inner" aria-hidden="true"></div>
                <div class="spokes" aria-hidden="true">
                    <span class="spoke" style="--angle: -90deg; --delay: 0s"></span>
                    <span class="spoke" style="--angle: -30deg; --delay: -0.8s"></span>
                    <span class="spoke" style="--angle: 30deg; --delay: -1.6s"></span>
                    <span class="spoke" style="--angle: 90deg; --delay: -2.4s"></span>
                    <span class="spoke" style="--angle: 150deg; --delay: -3.2s"></span>
                    <span class="spoke" style="--angle: 210deg; --delay: -4s"></span>
                </div>
                <div class="core" aria-hidden="true"><strong>OCULOX</strong><span>CORE</span></div>

                <a class="service-node" href="MALCOLM_DASHBOARDS_URL_REPLACER">
                    <span class="hexagon">
                        <span class="hexagon-inner"><img class="service-icon" src="assets/img/MALCOLM_DASHBOARDS_ICON_REPLACER" alt="OpenSearch Dashboards" /></span>
                    </span>
                    <span class="service-name">Dashboards</span>
                </a>

                <a class="service-node" href="/arkime/">
                    <span class="hexagon">
                        <span class="hexagon-inner"><img class="service-icon" src="assets/img/arkime.svg" alt="Arkime" /></span>
                    </span>
                    <span class="service-name">Sessions</span>
                </a>

                <a class="service-node" href="MALCOLM_NETBOX_URL_REPLACER">
                    <span class="hexagon">
                        <span class="hexagon-inner"><img class="service-icon" src="assets/img/netbox_icon.svg" alt="NetBox" /></span>
                    </span>
                    <span class="service-name">Actifs</span>
                </a>

                <a class="service-node" href="/arkime/cyberchef.html">
                    <span class="hexagon">
                        <span class="hexagon-inner"><img class="service-icon" src="assets/img/cyberchef.svg" alt="CyberChef" /></span>
                    </span>
                    <span class="service-name">Conversion</span>
                </a>

                <a class="service-node" href="/upload/">
                    <span class="hexagon">
                        <span class="hexagon-inner">
                            <svg class="service-icon symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M12 16V4" />
                                <path d="m7 9 5-5 5 5" />
                                <path d="M20 15v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4" />
                            </svg>
                        </span>
                    </span>
                    <span class="service-name">Import</span>
                </a>

                <a class="service-node" href="MALCOLM_AUTH_URL_REPLACER">
                    <span class="hexagon">
                        <span class="hexagon-inner">
                            <svg class="service-icon symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="8" r="4" />
                                <path d="M4 21a8 8 0 0 1 16 0" />
                            </svg>
                        </span>
                    </span>
                    <span class="service-name">Utilisateurs</span>
                </a>

            </div>
        </section>

        <footer class="site-footer">
            <span>© 2026 Oculox</span>
            <span>Cybersécurité industrielle</span>
        </footer>

        <script>
            (() => {
                const root = document.documentElement;
                const toggle = document.getElementById('themeToggle');
                const label = document.getElementById('themeLabel');
                const savedTheme = localStorage.getItem('oculox-theme');
                const initialTheme = savedTheme === 'light' ? 'light' : 'dark';

                const setTheme = (theme) => {
                    const isDark = theme === 'dark';
                    root.setAttribute('data-theme', theme);
                    toggle.setAttribute('aria-pressed', String(isDark));
                    label.textContent = isDark ? 'Dark' : 'Light';
                    localStorage.setItem('oculox-theme', theme);
                };

                setTheme(initialTheme);
                toggle.addEventListener('click', () => {
                    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
                });
            })();
        </script>
    </body>
</html>
